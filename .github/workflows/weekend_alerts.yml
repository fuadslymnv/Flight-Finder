name: Weekend Flight Deals Alert

on:
  schedule:
    # Runs every 6 hours aligned with 9:00 AM CET (UTC+1).
    # Using minute 7 avoids the heavy GitHub Actions queue congestion at minute 0:
    # 08:07 UTC = 09:07 CET
    # 14:07 UTC = 15:07 CET
    # 20:07 UTC = 21:07 CET
    # 02:07 UTC = 03:07 CET
    - cron: '7 2,8,14,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore Alert History Cache
        uses: actions/cache@v4
        with:
          path: flight_cache.db
          key: flight-cache-${{ github.run_id }}
          restore-keys: |
            flight-cache-

      - name: Run Weekend Deals Alert Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python alert_watcher.py --now
