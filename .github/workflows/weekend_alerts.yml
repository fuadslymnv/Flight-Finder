name: Weekend Flight Deals Alert

on:
  schedule:
    # Runs every 6 hours starting from 9:00 AM CET (UTC+1):
    # 08:00 UTC = 09:00 CET
    # 14:00 UTC = 15:00 CET
    # 20:00 UTC = 21:00 CET
    # 02:00 UTC = 03:00 CET
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore Alert History Cache
        uses: actions/cache@v4
        with:
          path: flight_cache.db
          key: flight-cache-${{ github.run_id }}
          restore-keys: |
            flight-cache-

      - name: Run Weekend Deals Alert Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python alert_watcher.py --now
